[tools]
node = "22"

[tasks.bundle]
description = "Install dependencies"
run = "npm install"

[tasks.dev]
description = "Start the development server"
run = "npm run dev"

[tasks.lint]
description = "Run ESLint"
run = "npm run lint"

[tasks.start]
description = "Start the production server"
run = "npm start"

[tasks.tsc]
description = "Run TypeScript type checking"
run = "npm run tsc"
