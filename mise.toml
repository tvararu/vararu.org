[tools]
bun = "latest"
hk = "latest"
pkl = "latest"
tinytex = "latest"
"github:WGUNDERWOOD/tex-fmt" = "latest"

[env]
_.path = ["./node_modules/.bin"]

[tasks.bundle]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Start the development server"
run = "bun run dev"

[tasks.ci]
description = "Run all checks in parallel"
run = "mise tsc"

[tasks.start]
description = "Start the production server"
run = "bun run start"

[tasks.tsc]
description = "Run TypeScript type checking"
run = "bun run tsc"

[tasks.cv]
description = "Build the CV PDF"
dir = "cv"
run = "latexmk -pdf cv.tex"

[tasks.resume]
description = "Build the base resume and all hashed variants"
dir = "cv"
run = "latexmk -pdf res.tex resume-*.tex"

[tasks."resume:watch"]
description = "Watch and rebuild a hashed resume PDF (e.g. mise resume:watch resume-rtly.tex)"
dir = "cv"
usage = 'arg "<file>" help="Resume .tex file to watch (e.g., resume-rtly.tex)"'
run = 'latexmk -pdf -pvc "$usage_file"'

[tasks."resume:clean"]
description = "Remove resume build artifacts"
dir = "cv"
run = "latexmk -C"

[tasks."cv:watch"]
description = "Watch and rebuild the CV PDF"
dir = "cv"
run = "latexmk -pdf -pvc cv.tex"

[tasks."cv:clean"]
description = "Remove CV build artifacts"
dir = "cv"
run = "latexmk -C"

[tasks.fmt]
description = "Format LaTeX files"
dir = "cv"
run = "tex-fmt *.tex"

[tasks."fmt:check"]
description = "Check LaTeX formatting"
dir = "cv"
run = "tex-fmt --check *.tex"
